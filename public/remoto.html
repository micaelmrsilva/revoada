<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b100f" media="(prefers-color-scheme: dark)">
<title>Revoada</title>
<link rel="icon" href="/icon.svg">
<style>
  /* Página do celular: mesma paleta do painel, uma coluna, alvos de toque grandes. */
  :root { --bg: #ffffff; --soft: #eceff0; --line: #dfe7e6; --ink: #0d1514; --on-ink: #ffffff; --text: #18211f; --mute: #5d6d6a; --faint: #8a9794; --red: #dc4347; --amber: #c97d16; --teal: #0e7490; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b100f; --soft: #1a2221; --line: #212b2a; --ink: #eef2f1; --on-ink: #0b100f; --text: #e4e9e8; --mute: #93a19e; --faint: #66736f; --red: #f0686b; --amber: #eaa94a; --teal: #4fc3d9; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
  button, textarea { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
  button:disabled { opacity: .4; }
  .num { font-variant-numeric: tabular-nums; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .label { font: 11px ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }

  header { display: flex; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top) + 12px) 16px 12px; border-bottom: 1px solid var(--line); min-height: 56px; }
  header img { width: 26px; height: 26px; }
  header .t { min-width: 0; flex: 1; }
  header b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header small { display: block; color: var(--mute); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .back { width: 44px; height: 44px; margin: -8px 0 -8px -12px; display: grid; place-items: center; color: var(--mute); }
  main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 16px 24px; }
  h6 { margin: 20px 0 8px; font: 11px ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); font-weight: 400; }

  .row { display: grid; grid-template-columns: 10px 1fr auto; gap: 12px; align-items: center; width: 100%; padding: 13px 0; border-bottom: 1px solid var(--line); min-height: 60px; }
  .row .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  .row.busy .dot { background: var(--teal); animation: pulse 1.1s ease-in-out infinite; }
  .row.wait .dot { background: var(--amber); }
  .row .tt { min-width: 0; } .row .tt b { display: block; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .tt small { display: block; color: var(--mute); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .st { font-size: 13px; color: var(--mute); white-space: nowrap; } .row.busy .st { color: var(--teal); } .row.wait .st { color: var(--amber); font-weight: 600; }
  @keyframes pulse { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .row.busy .dot, .working i { animation: none; } }

  .accs { display: grid; gap: 10px; }
  .acc { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; font-size: 14px; }
  .acc small { color: var(--mute); } .acc.hit small { color: var(--red); }
  .acc .bar { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--soft); overflow: hidden; } .acc .bar i { display: block; height: 100%; background: var(--teal); border-radius: 2px; } .acc.hot .bar i { background: var(--amber); } .acc.hit .bar i { background: var(--red); }

  .empty { color: var(--mute); padding: 28px 0; }
  .pairing { padding: 40px 8px; display: grid; gap: 14px; } .pairing h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.01em; } .pairing p { margin: 0; color: var(--mute); }
  .pairing ol { margin: 0; padding-left: 20px; display: grid; gap: 8px; }

  .msgs { display: grid; gap: 18px; padding-top: 12px; }
  .m { display: grid; gap: 8px; min-width: 0; }
  .m.user { justify-items: end; }
  .bubble { background: var(--soft); border-radius: 18px; padding: 10px 14px; max-width: 88%; white-space: pre-wrap; word-break: break-word; }
  .who { font-size: 13px; color: var(--mute); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; } .who b { color: var(--text); font-weight: 600; }
  .tag { font: 11px ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--teal); }
  .md { min-width: 0; overflow-wrap: anywhere; line-height: 1.5; }
  .md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
  .md p { margin: 0 0 10px; } .md ul, .md ol { margin: 0 0 10px; padding-left: 22px; } .md li { margin: 4px 0; } .md li > ul, .md li > ol { margin: 4px 0 0; }
  .md li.task { list-style: none; margin-left: -20px; } .md li.task .tk { display: inline-block; width: 20px; color: var(--mute); }
  .md h2 { font-size: 19px; margin: 18px 0 8px; } .md h3 { font-size: 17px; margin: 16px 0 6px; } .md h4 { font-size: 16px; margin: 14px 0 4px; }
  .md a { color: var(--teal); } .md s { color: var(--mute); } .md hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
  .md code { font: 14px ui-monospace, "SF Mono", Menlo, monospace; background: var(--soft); padding: 1px 5px; border-radius: 5px; }
  .md pre { position: relative; background: var(--soft); border-radius: 10px; padding: 12px; overflow-x: auto; margin: 0 0 10px; } .md pre code { background: none; padding: 0; font-size: 13px; } .md pre .lang { display: none; }
  .md blockquote { margin: 0 0 10px; padding-left: 12px; border-left: 2px solid var(--line); color: var(--mute); }
  .md .tbl { overflow-x: auto; margin: 0 0 12px; border: 1px solid var(--line); border-radius: 10px; }
  .md table { border-collapse: collapse; width: 100%; font-size: 14px; } .md th, .md td { padding: 8px 10px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
  .md th { font-weight: 600; white-space: nowrap; } .md tbody tr:last-child td { border-bottom: 0; }
  details.act { border: 1px solid var(--line); border-radius: 10px; font-size: 13px; }
  details.act summary { list-style: none; display: flex; gap: 8px; align-items: center; padding: 10px 12px; min-height: 44px; }
  details.act summary::-webkit-details-marker { display: none; }
  details.act summary .what { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  details.act summary .s { color: var(--mute); white-space: nowrap; } details.act summary .s.bad { color: var(--red); } details.act summary .s.run { color: var(--teal); }
  details.act pre { margin: 0; padding: 10px 12px; border-top: 1px solid var(--line); font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace; white-space: pre-wrap; word-break: break-word; max-height: 240px; overflow-y: auto; color: var(--mute); }
  .files { font-size: 13px; color: var(--mute); } .files span { color: var(--text); }
  .sys { font-size: 14px; padding: 9px 12px; border-radius: 10px; background: var(--soft); } .sys.red { color: var(--red); } .sys.amber { color: var(--amber); } .sys.mute { color: var(--mute); }
  .working { display: flex; align-items: center; gap: 10px; color: var(--mute); font-size: 14px; } .working i { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); animation: pulse 1.1s ease-in-out infinite; }
  .ask { border: 1.5px solid var(--amber); border-radius: 14px; padding: 14px; display: grid; gap: 12px; }
  .ask b { font-weight: 600; }
  .ask code { display: block; font: 13px/1.5 ui-monospace, "SF Mono", Menlo, monospace; background: var(--soft); border-radius: 8px; padding: 10px; white-space: pre-wrap; word-break: break-word; max-height: 200px; overflow-y: auto; }
  .ask .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ask.done { border: 1px solid var(--line); padding: 10px 12px; font-size: 13px; color: var(--mute); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn { background: var(--ink); color: var(--on-ink); border-radius: 12px; min-height: 48px; padding: 0 18px; font-weight: 600; text-align: center; }
  .btn.line { background: none; color: var(--text); border: 1px solid var(--line); }
  .btn.stop { background: none; color: var(--red); border: 1px solid var(--red); }

  footer { border-top: 1px solid var(--line); padding: 10px 16px calc(env(safe-area-inset-bottom) + 10px); display: none; gap: 10px; align-items: flex-end; }
  footer.on { display: flex; }
  footer textarea { flex: 1; min-height: 48px; max-height: 140px; resize: none; border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--bg); font-size: 16px; }
  footer textarea:focus { outline: 2px solid var(--teal); outline-offset: -1px; }
  footer .btn { flex: none; }
  footer .btn.stop { flex: 1; }
</style>
</head>
<body>
<script src="/md.js"></script>
<header id="head"></header>
<main id="main"></main>
<footer id="foot"></footer>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const hm = (t) => new Date(t).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
const ago = (t) => { const m = Math.floor((Date.now() - t) / 60000); return m < 1 ? "agora" : m < 60 ? `há ${m} min` : m < 1440 ? `há ${Math.floor(m / 60)}h` : `há ${Math.floor(m / 1440)}d`; };

// o código chega depois do # (o navegador não manda esse trecho ao servidor) e fica só neste aparelho
let token = "";
try { token = localStorage.getItem("revoada-token") || ""; } catch {}
if (location.hash.length > 8) {
  token = location.hash.slice(1);
  try { localStorage.setItem("revoada-token", token); } catch {}
  history.replaceState(null, "", location.pathname);
}

let S = null, open = null, chat = null, denied = false, waitingBefore = new Set(), draft = "";

async function api(path, method = "GET", body) {
  const r = await fetch(`/r/${path}`, { method, headers: { authorization: `Bearer ${token}`, ...(body ? { "content-type": "application/json" } : {}) }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401 || r.status === 429) { denied = r.status === 401 ? "O código deste aparelho não vale mais." : "Muitas tentativas com código errado. Espere alguns minutos."; if (r.status === 401) { token = ""; try { localStorage.removeItem("revoada-token"); } catch {} } paint(); throw new Error("sem acesso"); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "falhou");
  return j;
}

function head(title, sub, back) {
  $("head").innerHTML = (back ? `<button class="back" id="back" aria-label="Voltar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>` : `<img src="/icon.svg" alt="">`)
    + `<div class="t"><b>${esc(title)}</b><small>${esc(sub)}</small></div>`;
  if (back) $("back").onclick = () => history.back();
}

function paintPairing() {
  head("Revoada", "aparelho não pareado");
  $("foot").className = "";
  $("main").innerHTML = `<div class="pairing"><h1>${denied ? esc(denied) : "Falta parear este aparelho."}</h1>
    <ol><li>No Mac, abra a Revoada.</li><li>Vá em Ajustes e toque em "Acompanhar pelo celular".</li><li>Aponte a câmera deste aparelho para o código que aparecer.</li></ol></div>`;
}

function paintList() {
  const busy = S.convos.filter((c) => c.working && !c.waiting).length, wait = S.convos.filter((c) => c.waiting).length;
  head(S.host, wait ? `${plural(wait, "agente esperando", "agentes esperando")} você` : busy ? `${plural(busy, "agente trabalhando", "agentes trabalhando")}` : "ninguém trabalhando");
  document.title = wait ? `(${wait}) Revoada` : "Revoada";
  $("foot").className = "";
  const rank = (c) => (c.waiting ? 0 : c.working ? 1 : 2);
  const list = [...S.convos].sort((a, b) => rank(a) - rank(b) || b.at - a.at).slice(0, 40);
  const row = (c) => `<button class="row ${c.waiting ? "wait" : c.working ? "busy" : ""}" data-open="${esc(c.id)}"><span class="dot"></span><span class="tt"><b>${esc(c.title)}</b><small>${esc(c.who)} · ${esc(c.cwd)}</small></span><span class="st">${c.waiting ? "esperando você" : c.working ? "trabalhando" : ago(c.at)}</span></button>`;
  const accs = S.accounts.map((a) => {
    const pct = Math.max(0, ...a.usage.map((u) => u.pct)), hit = a.limitUntil;
    return `<div class="acc ${hit ? "hit" : pct >= 80 ? "hot" : ""}"><span>${esc(a.name)}</span><small class="num">${hit ? `no limite até ${hm(hit)}` : a.usage.length ? a.usage.map((u) => `${{ five_hour: "5h", seven_day: "7d" }[u.key] || u.key} ${u.pct}%`).join(" · ") : "pronta"}</small>${a.usage.length || hit ? `<span class="bar"><i style="width:${hit ? 100 : pct}%"></i></span>` : ""}</div>`;
  }).join("");
  $("main").innerHTML = (list.length ? `<h6>Conversas</h6>${list.map(row).join("")}` : `<div class="empty">Nenhuma conversa ainda. Comece uma no Mac e ela aparece aqui.</div>`)
    + (accs ? `<h6>Contas</h6><div class="accs">${accs}</div>` : "");
}

const openActs = new Set();
function itemHtml(it, key) {
  if (it.kind === "text") return `<div class="md">${md(it.text)}</div>`;
  if (it.kind === "note") return `<div class="sys ${esc(it.tone)}">${esc(it.text)}</div>`;
  if (it.kind === "ask") {
    const what = { Bash: "rodar este comando", Edit: "editar este arquivo", Write: "criar este arquivo", MultiEdit: "editar este arquivo", WebFetch: "abrir este endereço", Read: "ler este arquivo" }[it.tool] || `usar ${it.tool}`;
    if (it.state !== "pending") return `<div class="ask done">${it.state === "allowed" ? "Permitido" : "Negado"} · ${esc(it.tool)} · ${esc(it.detail)}</div>`;
    return `<div class="ask"><b>O agente quer ${esc(what)}:</b><code>${esc(it.detail)}</code><div class="btns"><button class="btn line" data-decide="deny" data-req="${esc(it.req)}">Negar</button><button class="btn" data-decide="allow" data-req="${esc(it.req)}">Permitir</button></div></div>`;
  }
  if (it.kind === "cmd") { const run = it.exit == null && it.status !== "failed"; return `<details class="act" data-key="${esc(key)}" ${openActs.has(key) ? "open" : ""}><summary><span class="what">${esc(it.desc || it.command)}</span><span class="s ${run ? "run" : it.exit ? "bad" : ""}">${run ? "rodando" : it.exit ? `saiu com ${it.exit}` : "ok"}</span></summary><pre>${esc(it.output) || "sem saída"}</pre></details>`; }
  if (it.kind === "files") return `<div class="files">Mexeu em ${it.changes.map((c) => `<span>${esc(c.path)}</span>`).join(", ")}</div>`;
  if (it.kind === "tool") return `<div class="files">Usou <span>${esc(it.name)}</span> ${esc(it.detail)}${it.status === "failed" ? " · falhou" : ""}</div>`;
  if (it.kind === "todo") return `<div class="files">${it.items.map((t) => `${t.done ? "✓" : "○"} <span>${esc(t.text)}</span>`).join("<br>")}</div>`;
  return "";
}
function msgHtml(m, i) {
  if (m.role === "user") return `<div class="m user">${m.attachments ? `<div class="files">${plural(m.attachments, "anexo", "anexos")}</div>` : ""}${m.text ? `<div class="bubble">${esc(m.text)}</div>` : ""}</div>`;
  const asking = m.items.some((x) => x.kind === "ask" && x.state === "pending");
  return `<div class="m"><div class="who">${m.review ? `<span class="tag">Revisão</span>` : ""}<b>${esc(m.who)}</b><span class="num">${hm(m.at)}</span>${m.state === "stopped" ? "<span>interrompido</span>" : ""}</div>`
    + m.items.map((it) => itemHtml(it, `${i}:${it.k}`)).join("")
    + (m.state === "working" ? `<div class="working" ${asking ? `style="color:var(--amber)"` : ""}><i ${asking ? `style="background:var(--amber)"` : ""}></i>${asking ? "esperando você" : "trabalhando"}</div>` : "")
    + (m.error ? `<div class="sys red">${esc(m.error)}</div>` : "") + `</div>`;
}
function paintChat() {
  head(chat.title, `${chat.cwd}${chat.waiting ? " · esperando você" : chat.working ? " · trabalhando" : ""}`, true);
  const box = $("main"), stick = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
  box.innerHTML = `<div class="msgs">${chat.skipped ? `<div class="sys mute">${plural(chat.skipped, "mensagem anterior", "mensagens anteriores")} no Mac.</div>` : ""}${chat.messages.map(msgHtml).join("")}</div>`;
  if (stick) box.scrollTop = box.scrollHeight;
  const foot = $("foot");
  if (chat.working) { foot.className = "on"; foot.innerHTML = `<button class="btn stop" id="stop">Parar o agente</button>`; }
  else if (S?.canSend) {
    // não redesenha o campo enquanto a pessoa escreve
    if (!$("say")) { foot.className = "on"; foot.innerHTML = `<textarea id="say" rows="1" placeholder="Responder nesta conversa" aria-label="Mensagem"></textarea><button class="btn" id="go">Enviar</button>`; $("say").value = draft; $("say").oninput = (e) => (draft = e.target.value); }
  } else foot.className = "";
}

function paint() {
  if (!token || denied) return paintPairing();
  if (open && chat) return paintChat();
  if (S) paintList();
}

async function loadState() {
  if (!token) return;
  S = await api("state");
  const now = new Set(S.convos.filter((c) => c.waiting).map((c) => c.id));
  if ([...now].some((id) => !waitingBefore.has(id))) navigator.vibrate?.([120, 80, 120]);
  waitingBefore = now;
  if (!open) paint();
}
async function loadChat(force) {
  if (!open) return;
  const id = open, r = await api(`convos/${id}${!force && chat ? `?rev=${chat.rev}` : ""}`).catch(() => null);
  if (!r || open !== id) return;
  if (!r.same) { const first = !chat; chat = r; paintChat(); if (first) $("main").scrollTop = $("main").scrollHeight; }
}
async function tick() {
  if (!document.hidden && token && !denied) { try { await loadState(); if (open) await loadChat(); } catch {} }
  setTimeout(tick, open && chat?.working ? 1000 : 3000);
}

function go(id) { open = id; chat = null; draft = ""; $("foot").className = ""; $("foot").innerHTML = ""; if (id) { $("main").innerHTML = ""; loadChat(true); } else paint(); }
window.addEventListener("popstate", () => go(history.state?.id || null));
document.addEventListener("visibilitychange", () => { if (!document.hidden && token) loadState().then(() => loadChat()).catch(() => {}); });

$("main").addEventListener("click", async (e) => {
  const o = e.target.closest("[data-open]");
  if (o) { history.pushState({ id: o.dataset.open }, ""); return go(o.dataset.open); }
  const b = e.target.closest("[data-decide]");
  if (b && open) {
    b.closest(".btns").querySelectorAll("button").forEach((x) => (x.disabled = true));
    await api(`convos/${open}/decide`, "POST", { req: b.dataset.req, decision: b.dataset.decide }).catch(() => {});
    loadChat(true);
  }
});
$("main").addEventListener("toggle", (e) => { const k = e.target.dataset?.key; if (k) e.target.open ? openActs.add(k) : openActs.delete(k); }, true);
$("foot").addEventListener("click", async (e) => {
  if (!open) return;
  if (e.target.id === "stop") { e.target.disabled = true; await api(`convos/${open}/stop`, "POST", {}).catch(() => {}); return loadChat(true); }
  if (e.target.id === "go") {
    const text = $("say").value.trim(); if (!text) return;
    e.target.disabled = true;
    try { await api(`convos/${open}/send`, "POST", { text }); draft = ""; $("foot").innerHTML = ""; } catch (err) { e.target.disabled = false; alert(err.message); }
    loadChat(true);
  }
});

paint();
// a primeira carga não espera a aba estar visível; as seguintes pausam com a tela apagada
if (token) loadState().catch(() => {});
setTimeout(tick, 3000);
</script>
</body>
</html>
